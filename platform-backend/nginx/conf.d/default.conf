# Per-IP request limits. Generous for the API: a whole school class can share one IP.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=contact:1m rate=5r/m;
limit_req_status 429;

server_tokens off;

server {
    listen 80;
    server_name thinkupacademy.ro www.thinkupacademy.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thinkupacademy.ro www.thinkupacademy.ro;

    ssl_certificate /etc/letsencrypt/live/thinkupacademy.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkupacademy.ro/privkey.pem;

    client_max_body_size 50M;

    # Docker's DNS: re-resolve container names, so recreated containers (new IPs) don't 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;
    set $frontend http://frontend:3000;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /contact {
        limit_req zone=contact burst=5 nodelay;
        proxy_pass $backend;
    }

    location ~ ^/(users|projects|user_projects|goals|materials|files|storage|contact|thumbnails|openSchool|reviews|personal_objectives|feedback|challenges|submissions|warnings) {
        limit_req zone=api burst=100 nodelay;
        proxy_pass $backend;
    }

    location / {
        limit_req zone=api burst=100 nodelay;
        proxy_pass $frontend;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
